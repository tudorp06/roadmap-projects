<html>
<head>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div id="popup">
        <div class="card-header">
            <img src="cookie.png" alt="cookie image" id="cookie-png">
            <button aria-label="Close card" id="xbtn">

            </button>
        </div>       
        <p>We use cookies to improve your experience.</p>
        <button id="accept-btn">I like cookies</button>
    </div>

    
</body>

</html>
